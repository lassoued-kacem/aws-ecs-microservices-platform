version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directories: ["/services/identity", "/services/ticketing"]
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/services/identity", "/services/ticketing"]
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: ["/terraform/bootstrap", "/terraform/foundation", "/terraform/envs/prod"]
    schedule: { interval: weekly }
