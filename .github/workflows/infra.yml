name: Infra

# PR    -> fmt, validate, tflint, checkov, terraform test, plan (read-only role), Infracost
# main  -> apply envs/prod ONLY when the ENV_ACTIVE repo variable is "true"
#          (guard: merging Terraform after a destroy must not silently rebuild
#          a paid environment).
on:
  pull_request:
    paths: ["terraform/**", "lambdas/**", ".github/workflows/infra.yml", ".tflint.hcl"]
  push:
    branches: [main]
    paths: ["terraform/**", "lambdas/**", ".github/workflows/infra.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "apply = create/update the environment"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: terraform-prod # two applies never race on the same state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_VAR_db_backup_retention_days: ${{ vars.DB_BACKUP_RETENTION_DAYS || '7' }} # 1 on AWS Free-plan accounts
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
  WORKDIR: terraform/envs/prod

jobs:
  static:
    name: fmt / validate / tflint / checkov / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.5
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
      - name: terraform fmt
        run: terraform fmt -check -recursive terraform
      - name: terraform validate (all layers)
        run: |
          for d in bootstrap foundation envs/prod modules/network modules/ecs-service modules/lambda-fn; do
            echo "== $d"; terraform -chdir=terraform/$d init -backend=false >/dev/null && terraform -chdir=terraform/$d validate
          done
      - name: terraform test (mocked, plan-only, zero cost)
        run: |
          for d in modules/network modules/ecs-service; do terraform -chdir=terraform/$d test; done
      - uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.66.0
      - name: tflint
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          for d in bootstrap foundation envs/prod modules/network modules/ecs-service modules/lambda-fn; do
            (cd terraform/$d && tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" -f compact)
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: checkov
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: terraform
          framework: terraform
          quiet: true
          compact: true

  plan:
    name: plan (PR)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.5
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: init
        run: terraform -chdir=$WORKDIR init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"
      - name: plan
        id: plan
        run: |
          set -o pipefail
          terraform -chdir=$WORKDIR plan -no-color -out=tfplan 2>&1 | tee plan.txt
          terraform -chdir=$WORKDIR show -json tfplan > plan.json
      - name: Comment plan on PR
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['(see logs)'])[0];
            if (plan.length > 60000) plan = plan.slice(-60000);
            const body = `### Terraform plan: \`envs/prod\`\n**${summary}**\n<details><summary>Full plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\nSensitive values are redacted by Terraform (\`sensitive = true\`).`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - name: Infracost
        if: env.INFRACOST_API_KEY != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
          infracost breakdown --path plan.json --format json --out-file infracost.json
          infracost comment github --path infracost.json --repo "$GITHUB_REPOSITORY" --pull-request "${{ github.event.pull_request.number }}" --github-token "$GITHUB_TOKEN" --behavior update

  apply:
    name: apply (main, guarded)
    needs: static
    if: >-
      (github.event_name == 'push' && vars.ENV_ACTIVE == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.5
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600 # RDS Multi-AZ create can take ~20 min
      - run: terraform -chdir=$WORKDIR init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${AWS_REGION}"
      - run: terraform -chdir=$WORKDIR plan -out=tfplan
      - run: terraform -chdir=$WORKDIR apply tfplan
      - name: Outputs
        run: terraform -chdir=$WORKDIR output
